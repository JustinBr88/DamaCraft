services:
  mongodb:
    image: mongo:7.0
    container_name: damastro_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: damastro
      MONGO_INITDB_ROOT_PASSWORD: damastro_local
      MONGO_INITDB_DATABASE: damastro
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - damastro_network

  ia:
    build:
      context: .
      dockerfile: ia/Dockerfile
    container_name: damastro_ia
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 5G
          cpus: '2'
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3002/health').then(r => r.json()).then(d => process.exit(d.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - damastro_network

volumes:
  mongodb_data:
    name: damastro_mongodb_data
  mongodb_config:
    name: damastro_mongodb_config

networks:
  damastro_network:
    driver: bridge